name: Sync DSPRE Upstream and Publish

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: dspre-upstream-sync-release
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream main
    if: github.repository == '969981/DSPRE' && github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      target_sha: ${{ steps.merge.outputs.target_sha }}
    steps:
      - name: Checkout local main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Merge upstream without losing local automation
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/DS-Pokemon-Rom-Editor/DSPRE.git
          git fetch --no-tags upstream main
          upstream_sha="$(git rev-parse FETCH_HEAD)"
          echo "Upstream main: $upstream_sha"
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo 'No new upstream commit; skipping merge.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git merge --no-edit "$upstream_sha" -m "chore: merge DSPRE upstream main"
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    name: Build Windows ZIP and publish commit release
    needs: sync
    if: >-
      ${{ always() && github.repository == '969981/DSPRE' &&
          (github.event_name == 'push' ||
          (needs.sync.result == 'success' &&
          (needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'))) }}
    runs-on: windows-latest
    steps:
      - name: Checkout exact synchronized commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.target_sha || github.sha }}

      - name: Identify unique release
        id: meta
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $short = $sha.Substring(0, 12)
          "short=$short" >> $env:GITHUB_OUTPUT
          "tag=auto-$short" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Skip release already published for this commit
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.meta.outputs.tag }}" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            'exists=true' >> $env:GITHUB_OUTPUT
            Write-Host 'Release already exists for this exact commit.'
          } else {
            'exists=false' >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Set up MSBuild
        if: steps.existing.outputs.exists != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Set up Rust
        if: steps.existing.outputs.exists != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch release-time dependencies
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/DS-Pokemon-Rom-Editor/scrcmd-database.git databases
          git clone --depth 1 https://github.com/DS-Pokemon-Rom-Editor/ds-rom.git ds-rom

      - name: Restore NuGet packages
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: nuget restore DS_Map.sln

      - name: Build DSPRE (.NET Framework 4.8)
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: msbuild DS_Map.sln /m /p:Configuration=Release

      - name: Build dsrom.exe helper
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          cargo build --release -p ds-rom-cli --manifest-path ds-rom/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'dsrom build failed' }
          New-Item -ItemType Directory -Force -Path 'DS_Map/bin/Release/Tools' | Out-Null
          Copy-Item 'ds-rom/target/release/dsrom.exe' 'DS_Map/bin/Release/Tools/dsrom.exe' -Force

      - name: Bundle application and script databases
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $out = 'DS_Map/bin/Release'
          if (!(Test-Path "$out/DSPRE.exe")) { throw 'DSPRE.exe not found: compilation produced no executable' }
          New-Item -ItemType Directory -Force -Path "$out/databases" | Out-Null
          robocopy databases "$out/databases" /E /XD .git | Out-Null
          if ($LASTEXITCODE -gt 7) { throw "robocopy failed: $LASTEXITCODE" }
          $zip = "DSPRE-windows-${{ steps.meta.outputs.short }}.zip"
          Compress-Archive -Path "$out/*" -DestinationPath $zip -CompressionLevel Optimal -Force
          if (!(Test-Path $zip)) { throw 'Release zip not generated' }

      - name: Preserve Windows ZIP as Actions artifact
        if: steps.existing.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DSPRE-windows-${{ steps.meta.outputs.short }}
          path: DSPRE-windows-${{ steps.meta.outputs.short }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish release on this repository
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ steps.meta.outputs.sha }}
          name: DSPRE Auto Build (${{ steps.meta.outputs.short }})
          prerelease: true
          generate_release_notes: true
          files: DSPRE-windows-${{ steps.meta.outputs.short }}.zip
          fail_on_unmatched_files: true
          body: |
            Automated Windows build of 969981/DSPRE.
            Source commit: ${{ steps.meta.outputs.sha }}
            Upstream: DS-Pokemon-Rom-Editor/DSPRE (main).
            Extract the ZIP and run DSPRE.exe on Windows with .NET Framework 4.8.
